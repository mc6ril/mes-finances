version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main-dev
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main-dev
    schedule:
      interval: monthly
